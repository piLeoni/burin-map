# Builds the packages for every platform, run by hand (gh workflow run build.yml).
# Nothing is published: the packages end up as artifacts of the run, and
# publishing is done from the terminal with what it produces.
#
# By hand and not on every push because of the cost on a private repo: a run
# is about ten macOS and Windows jobs, and their minutes count 10x and 2x.

name: Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  # crates.io: the engine and the CLI. The other crates are bindings, shipped by
  # PyPI and npm. `publish = false` is lifted only inside this job, so that
  # cargo agrees to package them.
  crates:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sed -i '/^publish = false/d' crates/burin-map-core/Cargo.toml crates/burin-map/Cargo.toml
      - run: cargo package -p burin-map-core -p burin-map --allow-dirty
      - uses: actions/upload-artifact@v4
        with:
          name: crates
          path: target/package/*.crate
          if-no-files-found: error

  # PyPI: one abi3 wheel per platform (any Python >= 3.10), plus the source package.
  wheels:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: '2_28' }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist
          if-no-files-found: error

  sdist:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error

  # npm: one native addon per platform, the targets listed in node/package.json.
  node:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, test: true }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, flags: --use-napi-cross, test: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, flags: --use-napi-cross }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, test: true }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: node
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Inside the repo rustup switches to the version in rust-toolchain.toml,
      # so the target goes on that one, not on the stable installed above.
      - run: rustup target add ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build -- --target ${{ matrix.target }} ${{ matrix.flags }}
        env:
          # ring's assembly needs it; the glibc 2.17 cross gcc doesn't define it.
          CFLAGS_aarch64_unknown_linux_gnu: -D__ARM_ARCH=8
      - run: npm test
        if: matrix.test
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: node/burin-map.*.node
          if-no-files-found: error

  # For now one npm package holds every addon; index.js picks the right one.
  npm:
    needs: node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: node
          merge-multiple: true
      - name: every target in package.json has its addon
        run: |
          set -euo pipefail
          ls -l burin-map.*.node
          n=$(find . -maxdepth 1 -name 'burin-map.*.node' | wc -l)
          want=$(node -p 'require("./package.json").napi.targets.length')
          [ "$n" -eq "$want" ] || { echo "expected $want addons, found $n"; exit 1; }
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: node/*.tgz
          if-no-files-found: error

  # The browser build, single-threaded like web/public/pkg. The threaded one
  # needs a nightly toolchain and a cross-origin isolated page, so it stays in
  # web/build-wasm.sh.
  wasm:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: wasm-pack build crates/burin-map-wasm --release --target web --scope pileoni --out-dir pkg -- --features gpu
      - run: cp README.md crates/burin-map-wasm/pkg/
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: crates/burin-map-wasm/pkg
