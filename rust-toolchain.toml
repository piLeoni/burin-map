# Pin the toolchain, so "clippy is clean" means the same thing everywhere.
#
# Without this file the CI and a developer can sit on different stables, and a
# new lint lands in one and not the other: `chunks_exact` with a constant chunk
# size passed locally on 1.95 and failed the first CI run on 1.98. Pinning makes
# the local answer the true one.
#
# Keep this in step with the `stable` used in .github/workflows/ci.yml; both
# read the same version, so a bump here is what moves the CI.
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
