[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "burin-map"
dynamic = ["version"]
description = "Pen-and-ink terrain maps from real elevation data"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.10"
keywords = ["terrain", "hillshade", "cartography", "streamlines", "generative-art", "bathymetry"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Multimedia :: Graphics",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
burin-map = "burin_map.cli:main"

[tool.maturin]
manifest-path = "crates/burin-map-py/Cargo.toml"
python-source = "python"
module-name = "burin_map._burin"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
