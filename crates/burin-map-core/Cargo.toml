[package]
name = "burin-map-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["plotter", "terrain", "hatching", "cartography", "svg"]
categories = ["graphics", "science::geo"]
description = "Drawing engine of burin-map: pen-and-ink terrain lines from an elevation grid"

[features]
# build_fields on the GPU (wgpu). Output differs slightly from the CPU path.
gpu = ["dep:wgpu", "dep:bytemuck", "dep:futures-channel", "dep:pollster"]

[dependencies]
rayon = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
terramask = { workspace = true }
wgpu = { version = "30", optional = true, default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "vulkan", "dx12", "webgpu"] }
bytemuck = { version = "1", optional = true, features = ["derive"] }
futures-channel = { version = "0.3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { version = "1", optional = true }
