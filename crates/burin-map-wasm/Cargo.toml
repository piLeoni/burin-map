[package]
name = "burin-map-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for the burin-map drawing engine"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]


[features]
# Multi-threaded build (web/build-wasm.sh): nightly, atomics, cross-origin isolated page.
threads = ["dep:wasm-bindgen-rayon"]
# draw_batches_gpu: terrain fields on WebGPU.
gpu = ["burin-map-core/gpu", "dep:wasm-bindgen-futures"]

[dependencies]
burin-map-core = { path = "../burin-map-core" }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O"]
