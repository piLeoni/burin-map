[package]
name = "burin-map-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for the burin-map drawing engine"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
burin-map-core = { path = "../burin-map-core" }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O"]
