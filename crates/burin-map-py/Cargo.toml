[package]
name = "burin-map-py"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_burin"
crate-type = ["cdylib"]

[dependencies]
burin-map = { workspace = true }
serde_json = "1"
burin-map-core = { workspace = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }

[features]
default = ["gpu"]
gpu = ["burin-map/gpu", "burin-map-core/gpu"]
