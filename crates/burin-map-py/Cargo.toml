[package]
name = "burin-map-py"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "_burin"
crate-type = ["cdylib"]

[dependencies]
burin-map = { path = "../burin-map" }
serde_json = "1"
burin-map-core = { path = "../burin-map-core" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }

[features]
default = ["gpu"]
gpu = ["burin-map/gpu", "burin-map-core/gpu"]
