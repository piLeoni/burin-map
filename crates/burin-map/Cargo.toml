[package]
name = "burin-map"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pen-and-ink terrain maps from SRTM elevation data"
publish = false

[[bin]]
name = "burin-map"
path = "src/main.rs"

[features]
default = ["gpu"]
# --gpu: terrain fields on the GPU (wgpu).
gpu = ["burin-map-core/gpu"]

[dependencies]
anstream = "0.6"
anstyle = "1"
burin-map-core = { workspace = true }
clap = { version = "4", features = ["string"] }
serde = { version = "1", features = ["derive"] }
flate2 = "1"
png = "0.17"
serde_json = "1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ureq = { version = "2", features = ["json"] }
json5 = "1.3.1"
