[package]
name = "burin-map"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pen-and-ink terrain maps from elevation tiles"
publish = false

[[bin]]
name = "burin-map"
path = "src/main.rs"

[features]
default = ["gpu"]
# --gpu: terrain fields on the GPU (wgpu).
gpu = ["burin-map-core/gpu"]

[dependencies]
anstream = "0.6"
anstyle = "1"
burin-map-core = { workspace = true }
# A document is a script; the CLI runs it the same way the web page does.
burin-map-script = { path = "../burin-map-script", version = "0.1.0" }
clap = { version = "4", features = ["string"] }
serde = { version = "1", features = ["derive"] }
png = "0.17"
serde_json = "1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ureq = { version = "2", features = ["json"] }
json5 = "1.3.1"
terramask = { workspace = true, features = ["fetch", "dem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
