[package]
name = "burin-map"
version = "0.1.0"
edition = "2021"
description = "Pen-and-ink terrain maps from SRTM elevation data"
publish = false

[[bin]]
name = "burin-map"
path = "src/main.rs"

[dependencies]
anstream = "0.6"
anstyle = "1"
burin-map-core = { path = "../burin-map-core" }
clap = { version = "4", features = ["string"] }
serde = { version = "1", features = ["derive"] }
flate2 = "1"
png = "0.17"
serde_json = "1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ureq = { version = "2", features = ["json"] }
json5 = "1.3.1"
