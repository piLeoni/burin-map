[package]
name = "burin-map-script-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "WebAssembly bindings for burin-map's script interpreter: a document in, its atlas out"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
burin-map-script = { path = "../burin-map-script" }
# The browser backend for the randomness and time Boa links in (scripts see neither).
boa_engine = { version = "0.22", default-features = false, features = ["js"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
