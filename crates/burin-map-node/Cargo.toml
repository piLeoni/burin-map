[package]
name = "burin-map-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["gpu"]
gpu = ["burin-map/gpu"]

[dependencies]
burin-map = { workspace = true }
burin-map-core = { workspace = true }
burin-map-script = { workspace = true }
serde_json = "1"
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
