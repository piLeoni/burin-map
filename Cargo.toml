[workspace]
members = ["crates/burin-core", "crates/burin", "crates/burin-py", "crates/burin-wasm"]
# burin-py / burin-wasm are built by maturin / wasm-pack, not a plain cargo build.
default-members = ["crates/burin-core", "crates/burin"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
