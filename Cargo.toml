[workspace]
members = ["crates/burin-core", "crates/burin", "crates/burin-py"]
# burin-py is a Python extension: built by maturin (`pip install .`), not cargo.
default-members = ["crates/burin-core", "crates/burin"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
