[workspace]
members = ["crates/burin-map-core", "crates/burin-map", "crates/burin-map-py", "crates/burin-map-wasm"]
# burin-map-py / burin-map-wasm are built by maturin / wasm-pack, not a plain cargo build.
default-members = ["crates/burin-map-core", "crates/burin-map"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
