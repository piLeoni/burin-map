[workspace]
members = [
  "crates/burin-map-core",
  "crates/burin-map-script",
  "crates/burin-map-script-wasm",
  "crates/burin-map",
  "crates/burin-map-py",
  "crates/burin-map-wasm",
  "crates/burin-map-node",
]
# py / wasm / node are built by maturin / wasm-pack / napi, not a plain cargo build.
default-members = ["crates/burin-map-core", "crates/burin-map"]
resolver = "2"

# One version for every crate, and for the Python and Node packages too:
# maturin reads it from burin-map-py, and the CI checks node/package.json.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/piLeoni/burin-map"

# crates.io needs a version next to each path, or it refuses the upload.
[workspace.dependencies]
burin-map-core = { path = "crates/burin-map-core", version = "0.1.0" }
burin-map = { path = "crates/burin-map", version = "0.1.0" }
# Without its HTTP client: the core only reads tiles, the CLI turns `fetch` on.
terramask = { path = "../terramask/crates/terramask", version = "0.2.0", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The script interpreter, loaded only when a document has to run: smaller over
# faster, since it is a whole extra module on a page that may never use it.
[profile.wasm-script]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
# Incremental builds are what filled target/ with tens of GB of session
# folders. Off: rebuilds are a little slower, but the cache stays sane.
incremental = false
